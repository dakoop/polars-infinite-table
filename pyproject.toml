[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polars-infinite-table"
version = "0.1.0"
description = "Infinite-scrolling Polars DataFrame display for Jupyter, built on anywidget"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0,<3",
    "anywidget>=0.9",
    "traitlets",
    "ipython",
]
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/polars_infinite_table"]

[tool.pytest.ini_options]
testpaths = ["tests"]
